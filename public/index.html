<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI CREW 3D Asset Lab</title>
  <style>
    body{margin:0;background:#0b0d12;color:#eef1f7;font-family:Inter,Arial,sans-serif}
    main{max-width:920px;margin:40px auto;padding:24px}
    h1{margin-bottom:8px}.muted{color:#9da6b5}
    textarea,input,select,button{width:100%;box-sizing:border-box;border-radius:10px;border:1px solid #2b3340;background:#121722;color:#fff;padding:12px}
    textarea{min-height:130px;resize:vertical}
    button{cursor:pointer;background:#5b67f1;border:0;font-weight:700}
    button:disabled{opacity:.5;cursor:not-allowed}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}
    .card{background:#111620;border:1px solid #242c38;border-radius:16px;padding:18px;margin-top:18px}
    #log{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:13px;color:#cbd3df}
    a{color:#8da2ff}
    @media(max-width:700px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <h1>AI CREW · 3D Asset Lab</h1>
  <div class="muted">Gemini/AI oyun sistemine gerçek GLB asset üretimi eklemek için test paneli.</div>

  <div class="card">
    <label>Access code</label>
    <input id="access" type="password" placeholder="ACCESS_CODE">
    <div class="grid">
      <div>
        <label>Asset adı</label>
        <input id="name" value="fantasy_knight">
      </div>
      <div>
        <label>Polygon</label>
        <input id="poly" type="number" value="10000" min="1000" max="30000">
      </div>
    </div>

    <label>3D prompt</label>
    <textarea id="prompt">stylized fantasy game-ready knight character, full body, medieval armor, blue cape, neutral standing pose, clean topology, PBR materials</textarea>
    <br><br>
    <button id="generate">3D Asset Oluştur</button>
  </div>

  <div class="card">
    <strong>Durum</strong>
    <div id="log">Hazır.</div>
  </div>

  <div class="card">
    <strong>Model</strong>
    <div id="model">Henüz model yok.</div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const log = msg => $("log").textContent = msg;

async function generate() {
  $("generate").disabled = true;
  $("model").textContent = "Üretiliyor...";
  try {
    const access = $("access").value.trim();
    const r = await fetch("/api/generate-3d", {
      method:"POST",
      headers:{
        "content-type":"application/json",
        "x-access-code":access
      },
      body:JSON.stringify({
        name:$("name").value.trim(),
        prompt:$("prompt").value.trim(),
        polycount:Number($("poly").value)
      })
    });

    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "3D generation failed");

    const taskId = data.taskId;
    if (!taskId) throw new Error("Provider task ID döndürmedi.");

    log("Task oluşturuldu: " + taskId + "\\nDurum bekleniyor...");

    for (;;) {
      await new Promise(x => setTimeout(x, 6000));

      const s = await fetch(
        "/api/asset-status?taskId=" + encodeURIComponent(taskId),
        {headers:{"x-access-code":access}}
      );
      const status = await s.json();

      log(
        "Task: " + taskId +
        "\\nDurum: " + status.status +
        "\\nİlerleme: " + (status.progress ?? "?") + "%"
      );

      if (status.status === "SUCCEEDED" || status.status === "COMPLETED") {
        if (!status.modelUrl) throw new Error("Model tamamlandı fakat GLB URL bulunamadı.");

        $("model").innerHTML =
          '<a target="_blank" rel="noopener" href="' +
          status.modelUrl +
          '">GLB modelini aç</a>';

        log("Tamamlandı.");
        break;
      }

      if (["FAILED","CANCELED","CANCELLED"].includes(status.status)) {
        throw new Error("3D üretimi başarısız oldu.");
      }
    }
  } catch (e) {
    log("HATA: " + e.message);
    $("model").textContent = "Model oluşturulamadı.";
  } finally {
    $("generate").disabled = false;
  }
}

$("generate").onclick = generate;
</script>
</body>
</html>
